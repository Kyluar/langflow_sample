name: 'Lint & Check Types'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**/src/**/*.tsx'
      - '**/src/**/*.ts'
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize]
    paths:
      - '**/src/**/*.tsx'
      - '**/src/**/*.ts'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v5

      - name: 🛠️ Setup Dependencies
        uses: ./.github/actions/setup/

      - name: ⬇️ Install Dependencies
        run: pnpm install

      - name: 🛠️ Generate Prisma Client
        run: pnpm turbo run --filter=@repo/database db:generate

      - name: 🧹 Run Linting
        run: pnpm run lint

      - name: 🔍 Run Check Types
        run: pnpm run check-types

      - name: ✨ Done!
        run: echo "Code quality checks complete"
